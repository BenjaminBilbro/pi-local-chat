name: checks

# Three suites that until now only ran when a human remembered them: the jsdom render-parity
# harness, the pytest suite, and the WebSocket smoke test. Voice extras are deliberately not
# installed here (torch, plus the gitignored experiments/RealtimeSTT fork: audit PK-01), which is
# why the audio markers stay excluded. The smoke test points the app at tools/fake_rpc_pi.py
# itself, so CI never launches a real pi.

on:
  push:
    # `refactor/**` is listed because the branch under review is the one whose code matters; a workflow that
    # only fires on merged branches checks code nobody is reading.
    branches: [master, main, "feature/**", "refactor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7 # latest release when written: v7.0.1

      - uses: actions/setup-python@v7 # latest release when written: v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7 # latest release when written: v7.1.0
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install runtime and test dependencies
        # -r on pyproject.toml installs the declared dependencies without building the project;
        # --group dev adds pytest, pytest-asyncio, pytest-timeout and httpx2.
        run: uv pip install --system -r pyproject.toml --group dev

      - name: Install node dev dependencies
        run: npm ci

      # Invoked through python directly rather than `npm test`, which wraps the same call in
      # `uv run` and would build a second environment here for no reason.
      - name: Parity render checks (jsdom)
        run: python tests/compare_render.py

      - name: Python tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -m "not audio_cpu" -p no:cacheprovider

      - name: WebSocket smoke test
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/smoke_test_ws.py

      # Two guards that are cheap and that nothing else in this file enforces.
      #
      # The census is the fixture truth-check that sat red for two weeks because it counted gaps that were
      # not gaps, and green while a real coverage hole stayed hidden (`QA-11`). It now verdicts the corpus.
      - name: Fixture census
        run: python tools/capture.py --census "data-samples/*.jsonl"

      # The reason this step exists is that it would have caught something that already happened: a capture
      # of this app records the child's system prompt verbatim, which is where the agent's injected memory
      # lives, and three fixtures on a branch about to be pushed for the first time carried it. See the
      # sweep-2 close-out and `tools/scrub_captures.py`.
      - name: No injected agent memory in the fixtures
        run: python tools/scrub_captures.py --check

      # docs/configuration.md is the replacement for .env.example, and a generated table is only trustworthy
      # while something regenerates it. `tests/test_config_reference.py` runs this same check, so the step is
      # here for the log line: a stale document should be visible in CI, not only in a test name.
      - name: Configuration reference is current
        run: python tools/config_reference.py --check
